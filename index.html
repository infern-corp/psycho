<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #000; }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 760px;
    background: #000000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  /* halo rojo tenue */
  .stage::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 42%;
    width: 620px;
    height: 520px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at center, rgba(139, 15, 15, .30), rgba(139, 15, 15, .07) 45%, transparent 70%);
    pointer-events: none;
  }

  /* ---------- ceniza ---------- */
  .ash { position: absolute; inset: 0; pointer-events: none; z-index: 1; }

  .ash i {
    position: absolute;
    top: -8px;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(210, 200, 190, .55);
    animation: fall linear infinite;
  }

  @keyframes fall {
    0%   { transform: translate3d(0, -10px, 0); opacity: 0; }
    12%  { opacity: .7; }
    85%  { opacity: .35; }
    100% { transform: translate3d(var(--dx), 105vh, 0); opacity: 0; }
  }

  /* ---------- núcleo ---------- */
  .core {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 0 22px;
    animation: rise 2.4s cubic-bezier(.2,.7,.2,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-wrap { position: relative; display: inline-block; }

  .logo {
    font-family: "Grenze Gotisch", "Times New Roman", serif;
    font-weight: 900;
    font-size: clamp(40px, 12vw, 88px);
    line-height: .92;
    letter-spacing: .13em;
    padding-left: .13em;
    white-space: nowrap;
    background-image: linear-gradient(178deg, #d8232a 0%, #a5111a 38%, #6b0a0e 68%, #480608 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 22px rgba(163, 17, 26, .55)) drop-shadow(0 2px 2px rgba(0,0,0,.9));
  }

  /* ---------- goteo ---------- */
  .drips {
    display: block;
    width: 100%;
    height: 78px;
    margin-top: -10px;
    overflow: visible;
  }

  .drips path {
    fill: #7a0c11;
    transform-origin: top center;
    animation: drip 7s ease-in-out infinite;
  }

  .drips path:nth-child(2) { animation-duration: 9s;  animation-delay: 1.1s; }
  .drips path:nth-child(3) { animation-duration: 6s;  animation-delay: 2.4s; }
  .drips path:nth-child(4) { animation-duration: 11s; animation-delay: .6s; }
  .drips path:nth-child(5) { animation-duration: 8s;  animation-delay: 3.2s; }
  .drips path:nth-child(6) { animation-duration: 10s; animation-delay: 1.8s; }
  .drips path:nth-child(7) { animation-duration: 6.5s; animation-delay: 4s; }

  @keyframes drip {
    0%, 100% { transform: scaleY(.86); opacity: .85; }
    50%      { transform: scaleY(1.14); opacity: 1; }
  }

  /* ---------- texto ---------- */
  .tag {
    margin-top: 10px;
    font-size: clamp(13px, 2.6vw, 17px);
    font-weight: 300;
    font-style: italic;
    letter-spacing: .34em;
    padding-left: .34em;
    color: #b9b0a6;
    text-transform: lowercase;
  }

  .rule {
    width: 60px;
    height: 1px;
    margin: 30px auto 0;
    background: linear-gradient(to right, transparent, rgba(163, 17, 26, .85), transparent);
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 34px;
    padding: 15px 34px;
    font-family: "Grenze Gotisch", serif;
    font-weight: 700;
    font-size: clamp(14px, 2.6vw, 18px);
    letter-spacing: .3em;
    padding-left: calc(34px + .3em);
    text-decoration: none;
    color: #e9e2d9;
    border: 1px solid rgba(163, 17, 26, .75);
    background: rgba(122, 12, 17, .07);
    transition: background .45s ease, color .45s ease, box-shadow .45s ease, border-color .45s ease;
  }

  .cta:hover {
    background: #8b0f0f;
    border-color: #d8232a;
    color: #fff;
    box-shadow: 0 0 34px rgba(163, 17, 26, .55);
  }

  .cta svg { width: 17px; height: 17px; fill: currentColor; flex: none; }

  .foot {
    margin-top: 26px;
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #6b6560;
  }

  @media (prefers-reduced-motion: reduce) {
    .ash i, .drips path, .core { animation: none; }
    .ash i { display: none; }
  }
</style>

<div class="stage">
  <div class="ash" aria-hidden="true"></div>

  <main class="core">
    <div class="logo-wrap">
      <h1 class="logo">PSYCHO</h1>
      <svg class="drips" viewBox="0 0 620 78" aria-hidden="true">
        <path d="M42 0h11v34q0 10-5.5 17Q42 44 42 34z"/>
        <path d="M118 0h9v48q0 9-4.5 15Q118 57 118 48z"/>
        <path d="M188 0h12v26q0 9-6 15-6-6-6-15z"/>
        <path d="M262 0h10v56q0 10-5 17-5-7-5-17z"/>
        <path d="M334 0h11v38q0 9-5.5 16-5.5-7-5.5-16z"/>
        <path d="M408 0h9v22q0 8-4.5 14-4.5-6-4.5-14z"/>
        <path d="M480 0h12v44q0 10-6 16-6-6-6-16z"/>
        <path d="M556 0h10v30q0 9-5 15-5-6-5-15z"/>
      </svg>
    </div>

    <p class="tag">explorando la oscuridad</p>

    <div class="rule"></div>

    <a class="cta" href="https://discord.gg/8TmNCePbn" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 640 512" aria-hidden="true"><path d="M524.5 69.8a1.5 1.5 0 0 0-.8-.7A485 485 0 0 0 404 32a1.8 1.8 0 0 0-1.9.9 337 337 0 0 0-14.9 30.6 448 448 0 0 0-134.4 0 309 309 0 0 0-15.2-30.6 1.9 1.9 0 0 0-1.9-.9A484 484 0 0 0 116 69.1a1.7 1.7 0 0 0-.8.7C39 183.7 18.2 294.7 28.4 404.4a2 2 0 0 0 .8 1.4A487 487 0 0 0 176 479.9a1.9 1.9 0 0 0 2.1-.7 348 348 0 0 0 30-48.8 1.9 1.9 0 0 0-1-2.6 321 321 0 0 1-45.9-21.9 1.9 1.9 0 0 1-.2-3.1q3.5-2.6 9.1-7.1a1.8 1.8 0 0 1 1.9-.3q96.2 43.9 295.5 0a1.8 1.8 0 0 1 1.9.2q4.4 3.7 9.2 7.2a1.9 1.9 0 0 1-.2 3.1 301 301 0 0 1-45.9 21.8 1.9 1.9 0 0 0-1 2.6 391 391 0 0 0 30 48.8 1.9 1.9 0 0 0 2.1.7 486 486 0 0 0 147-74.1 1.9 1.9 0 0 0 .8-1.4c12.2-126.8-20.6-236.9-87-334.6zM222.5 337.6c-29 0-52.8-26.6-52.8-59.2s23.4-59.2 52.8-59.2c29.7 0 53.3 26.8 52.8 59.2 0 32.6-23.4 59.2-52.8 59.2zm195.4 0c-29 0-52.8-26.6-52.8-59.2s23.4-59.2 52.8-59.2c29.7 0 53.3 26.8 52.8 59.2 0 32.6-23.2 59.2-52.8 59.2z"/></svg>
      UNIRSE AL DISCORD
    </a>

    <p class="foot">comunidad · 18+</p>
  </main>
</div>

<script>
  (function () {
    const box = document.querySelector('.ash');
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('i');
      const dur = 11 + Math.random() * 14;
      s.style.left = Math.random() * 100 + '%';
      s.style.setProperty('--dx', (Math.random() * 80 - 40).toFixed(1) + 'px');
      s.style.animationDuration = dur.toFixed(1) + 's';
      s.style.animationDelay = (-Math.random() * dur).toFixed(1) + 's';
      s.style.opacity = (0.25 + Math.random() * 0.5).toFixed(2);
      if (Math.random() > 0.7) { s.style.width = '3px'; s.style.height = '3px'; }
      box.appendChild(s);
    }
  })();
</script>
